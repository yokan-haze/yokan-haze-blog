# 这里原本填的是上游主题作者的收款渠道：
#     ko_fi: cuteleaf
#     custom: ['https://ifdian.net/a/cuteleaf']
# 那会导致任何人打开本站仓库、点「Sponsor」都被引到**主题作者**的收款页 ——

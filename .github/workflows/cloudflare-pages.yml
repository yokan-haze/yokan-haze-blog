# 自动部署到 Cloudflare Pages
#
# 原理：你在 Pages CMS 保存 -> 内容提交到本仓库 -> GitHub 的服务器自动构建 -> 上传到 Cloudflare
# 全程在 GitHub 的服务器上完成，不依赖你本机开机或网络状况。
#
# 需要在仓库里配置一个密钥（Settings -> Secrets and variables -> Actions）：
#   CLOUDFLARE_API_TOKEN = 在 Cloudflare 创建的 API 令牌
name: 部署到 Cloudflare Pages

on:
  push:
    branches: [main]
  # 也支持在 Actions 页面手动触发
  workflow_dispatch:

# 连续推送时取消上一次未完成的构建，只跑最新的
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read # 保持最小：只需要读代码
      issues: write # 仅用于「部署失败时创建/更新 Issue」这一个用途

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        id: deps
        run: pnpm install --frozen-lockfile

      # 只改内容的提交不必跑类型检查（省约 14s）：发文章 / 换图只动 src/content/** 与
      # public/**，源码没变就不可能引入类型错误。
      # **只要出现任何其它路径**（源码、配置、脚本、工作流本身），或者事件不是 push、
      # 或者拿不到可比较的提交范围，就一律照常检查 —— 宁可慢一点，不能漏检。
      - name: 判断是否需要跑类型检查
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          RUN_CHECK=true
          EMPTY_SHA="0000000000000000000000000000000000000000"

          if [ "$EVENT_NAME" != "push" ] \
             || [ -z "$BEFORE_SHA" ] || [ -z "$AFTER_SHA" ] \
             || [ "$BEFORE_SHA" = "$EMPTY_SHA" ] || [ "$AFTER_SHA" = "$EMPTY_SHA" ]; then
            echo "事件是 ${EVENT_NAME}、或没有可比较的提交范围（${BEFORE_SHA}..${AFTER_SHA}）→ 照常类型检查。"
          else
            # 取本次推送的改动清单：优先本地 git（checkout 深度够时最准），
            # 深度不够（actions/checkout 默认 depth=1）就退回 GitHub compare API。
            #
            # 重命名/复制必须把**旧路径**也算进来（见下）：`git diff --name-only` 与
            # compare API 的 `.files[].filename` 都只给**目标路径**，旧路径分别在
            # --name-status 的第二列与 `.previous_filename`。若不算旧路径，
            # 「把源码文件搬进 src/content/」会被误判成纯内容改动而跳过类型检查。
            # 保守方向：重命名/复制一律把两个路径都列出 —— 旧路径在内容目录之外时，
            # 就会走「照常类型检查」分支。
            CHANGED=""
            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              CHANGED="$(git diff --name-status -M "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null \
                | awk -F'\t' '{ if ($1 ~ /^[RC]/) { print $2; print $3 } else { print $2 } }' || true)"
            fi
            if [ -z "$CHANGED" ]; then
              CHANGED="$(gh api "repos/${REPO}/compare/${BEFORE_SHA}...${AFTER_SHA}" \
                --jq '.files[] | .filename, (.previous_filename // empty)' 2>/dev/null || true)"
            fi
            COUNT="$(printf '%s' "$CHANGED" | grep -c . || true)"

            if [ "$COUNT" -eq 0 ]; then
              echo "拿不到本次推送的改动清单 → 照常类型检查（宁可慢，不能漏）。"
            elif [ "$COUNT" -ge 300 ]; then
              echo "改动文件数达到 compare API 的 300 条上限（${COUNT}）→ 无法确信范围，照常类型检查。"
            else
              OUTSIDE="$(printf '%s\n' "$CHANGED" | grep -vE '^(src/content/|public/)' || true)"
              if [ -z "$OUTSIDE" ]; then
                RUN_CHECK=false
                echo "本次 ${COUNT} 个改动文件全部落在 src/content/ 或 public/ 内 → 跳过类型检查（省约 14s）。"
                printf '%s\n' "$CHANGED"
              else
                echo "改动里包含内容目录之外的路径 → 照常类型检查。前 20 个："
                printf '%s\n' "$OUTSIDE" | head -n 20
              fi
            fi
          fi

          echo "run_check=$RUN_CHECK" >> "$GITHUB_OUTPUT"

      # 质量闸门：类型/内容集合检查不过就不部署。
      # 注意：这一步是硬闸门，失败会拦住下面的构建与部署。
      # 只改内容时会按上面的判断跳过（跳过≠放宽：源码/配置一改就照常跑）。
      - name: 类型检查（astro check）
        id: check
        if: steps.scope.outputs.run_check == 'true'
        run: pnpm astro check

      # 只有真有超限视频时才装 ffmpeg（省约 24s）。
      # 判断依据是 scripts/compress-videos.ts 的 --check 模式 —— 它用的是**同一个
      # TARGET_BYTES 常量**，所以不会出现「这里说不用压、那边却要压」的漂移。
      # 注意这只是「要不要提前备好 ffmpeg」的优化：真到构建期若发现有超限视频却没有
      # ffmpeg，compress-videos.ts 仍按 t13 的约定在 CI 上硬失败，不会静默跳过。
      - name: 判断是否需要压缩视频（决定是否安装 ffmpeg）
        id: video
        shell: bash
        run: |
          if pnpm exec tsx scripts/compress-videos.ts --check; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "✅ 没有超限视频 → 跳过 ffmpeg 安装（省约 24s）"
          else
            code=$?
            echo "needed=true" >> "$GITHUB_OUTPUT"
            if [ "$code" -eq 1 ]; then
              echo "⚠ 存在超限视频 → 安装 ffmpeg 并在构建期压缩"
            else
              echo "::warning::--check 的退出码是 $code（预期 0 或 1），无法确认是否需要压缩；保守起见照常安装 ffmpeg。"
            fi
          fi

      # 构建期视频压缩需要 ffmpeg（含 libx264）。
      # ubuntu-24.04 runner 镜像的 apt 预装列表里没有 ffmpeg，所以这里显式安装；
      # libavcodec-extra 保证 libx264 编码器存在。
      # 缺失时只告警不失败 —— 压缩脚本会在真有超限视频时硬失败（见 t13 的约定）。
      - name: 确保 ffmpeg 可用（含 libx264 编码器）
        id: ffmpeg
        if: steps.video.outputs.needed == 'true'
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 \
             || ! ffmpeg -hide_banner -encoders 2>/dev/null | grep -q 'libx264'; then
            echo "ffmpeg 或 libx264 缺失，安装中…"
            sudo apt-get update -qq || true
            sudo apt-get install -y --no-install-recommends ffmpeg libavcodec-extra \
              || sudo apt-get install -y --no-install-recommends ffmpeg \
              || echo "::warning::ffmpeg 安装失败，本次跳过视频压缩（不影响构建与部署）"
          fi
          if ffmpeg -hide_banner -encoders 2>/dev/null | grep -q 'libx264'; then
            ffmpeg -version | head -n 1
            echo "✅ ffmpeg + libx264 就绪，构建期将压缩 public/assets/videos/*.mp4"
          else
            echo "::warning::ffmpeg 缺少 libx264，构建期视频压缩会被跳过（不影响构建与部署）"
          fi

      - name: 构建站点
        id: build
        run: pnpm build

      # 部署到 Cloudflare Pages（失败自动重试）
      #
      # 为什么重试：Cloudflare 偶发返回 `Failed to publish your Function. Got error:
      # Unknown internal error occurred.` —— 实测手工重跑同一次运行就成功，是瞬时错误。
      # 2026-10 就因为这个瞬时错误让站点停在旧版本整整 15 小时。
      #
      # 重试策略：共 3 次尝试，间隔 15s / 45s（指数退避）。
      # **绝不吞掉失败**：3 次都失败时 `exit 1`，GitHub 仍把这次运行标成失败；
      # 写成 `|| true` 会得到「绿构建 + 站点没更新」的静默失败，那正是要修的问题。
      #
      # **--branch 必须用实际分支名，绝不能写死 main**（2026-10-13 的事故）：
      # Cloudflare Pages 靠 --branch 区分生产与预览 —— 只有等于项目 production branch
      # （main）时才更新 https://yokan-haze.pages.dev，其它分支只产生预览部署。
      # 写死 --branch=main 会让**任何分支上的运行**都把产物推到生产：当时一个临时测试
      # 分支的树不含站长刚发的两篇文章，一跑就把线上首页覆盖成了旧内容。
      #
      # 每次尝试的日志落盘到 deploy-attempt-N.log，失败时的关键行汇总到
      # deploy-failure.log，交给下面「失败时留下可见记录」那一步写进 Issue。
      #
      # 这段刻意只用 POSIX sh 写法（不用数组 / PIPESTATUS / tee），这样它在本机的 sh
      # 下也能原样跑一遍，不必等推上去才知道控制流对不对。
      - name: 部署到 Cloudflare Pages（失败自动重试）
        id: deploy
        shell: bash
        run: |
          MAX_ATTEMPTS=3   # 1 次首发 + 2 次重试
          DELAY=15         # 首次重试前等 15s，之后 ×3（15s -> 45s）
          FAILED_LOG="deploy-failure.log"
          : > "$FAILED_LOG"

          # 生产分支是 main；其它分支只做预览部署，绝不会碰生产站点。
          BRANCH="${GITHUB_REF_NAME:-}"
          if [ -z "$BRANCH" ]; then
            echo "::error::拿不到分支名（GITHUB_REF_NAME 为空）。拒绝猜测 —— 猜成 main 就等于把非 main 的产物推上生产。"
            exit 1
          fi
          if [ "$BRANCH" = "main" ]; then
            echo "🌐 分支 = ${BRANCH} → 生产部署（会更新 https://yokan-haze.pages.dev）"
          else
            echo "🧪 分支 = ${BRANCH} → 预览部署（只产生预览域名，不会改变线上站点）"
          fi

          i=1
          while [ "$i" -le "$MAX_ATTEMPTS" ]; do
            LOG="deploy-attempt-${i}.log"
            echo "::group::部署尝试 ${i}/${MAX_ATTEMPTS}"
            if pnpm exec wrangler pages deploy dist --project-name=yokan-haze --branch="$BRANCH" >"$LOG" 2>&1; then
              cat "$LOG"
              echo "::endgroup::"
              echo "✅ 第 ${i} 次尝试成功（本步骤共尝试 ${i} 次）"
              exit 0
            fi
            cat "$LOG"
            echo "::endgroup::"

            # 把这次失败的关键行汇总下来（下面的 Issue 步骤读这个文件）
            #
            # 必须剥掉 ANSI 转义序列：wrangler 即使 stderr 不是 TTY 也会上色，
            # 原样抄进 Issue 正文会变成 `[31m✘ [41;31m[[41;97mERROR…` 这类垃圾，
            # 而这一段恰好是站长「不点进 Actions 就知道为什么失败」的唯一线索。
            # 两道保险：上面 env 里的 NO_COLOR=1（源头不上色）+ 这里的 sed 剥离
            # （万一某些环境下 wrangler 仍然上色）。
            ESC=$(printf '\033')
            {
              echo "----- 第 ${i}/${MAX_ATTEMPTS} 次尝试失败 -----"
              grep -E '✘|ERROR|Error|error|Failed|failed|Unknown internal error' "$LOG" \
                | sed "s/${ESC}\[[0-9;]*[A-Za-z]//g" | tail -n 12 || true
              echo "（该次日志的最后 4 行）"
              tail -n 4 "$LOG" | sed "s/${ESC}\[[0-9;]*[A-Za-z]//g" || true
            } >> "$FAILED_LOG"

            if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning::第 ${i} 次部署失败，${DELAY}s 后重试（共 ${MAX_ATTEMPTS} 次尝试）"
              sleep "$DELAY"
              DELAY=$((DELAY * 3))
            fi
            i=$((i + 1))
          done

          echo "::error::Cloudflare Pages 部署连续 ${MAX_ATTEMPTS} 次失败，放弃；站点仍停留在上一版。"
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1fae28eb2e756180542c9542e20b6957
          # 不要给日志上色：失败时的关键错误行会被抄进 Issue 正文，
          # 带 ANSI 转义序列就没法读了（下面另有 sed 剥离兜底）。
          NO_COLOR: "1"

      # 失败必须让人看得见：Actions 的红色叉站长不会主动去看，所以失败时自动开一条 Issue。
      # 去重只在「未关闭」的同名 Issue 里找：还在处理中的那条会被追加评论（不刷屏）；
      # 已关闭的视为「已处理」，同样的问题再次出现时会新建一条，而不是复活旧记录。
      - name: 失败时留下可见记录（创建/更新 Issue）
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TITLE="⚠️ 部署失败"

          # 定位失败步骤（上面的关键步骤都标了 id）
          FAILED_STEP=""
          if [ "${{ steps.deps.outcome }}" = "failure" ]; then FAILED_STEP="安装依赖"; fi
          if [ "${{ steps.scope.outcome }}" = "failure" ]; then FAILED_STEP="判断是否需要跑类型检查"; fi
          if [ "${{ steps.check.outcome }}" = "failure" ]; then FAILED_STEP="类型检查（astro check）"; fi
          if [ "${{ steps.video.outcome }}" = "failure" ]; then FAILED_STEP="判断是否需要压缩视频（决定是否安装 ffmpeg）"; fi
          if [ "${{ steps.ffmpeg.outcome }}" = "failure" ]; then FAILED_STEP="确保 ffmpeg 可用（含 libx264 编码器）"; fi
          if [ "${{ steps.build.outcome }}" = "failure" ]; then FAILED_STEP="构建站点"; fi
          if [ "${{ steps.deploy.outcome }}" = "failure" ]; then FAILED_STEP="部署到 Cloudflare Pages（失败自动重试）"; fi
          if [ -z "$FAILED_STEP" ]; then FAILED_STEP="（未能从步骤状态定位，见运行日志）"; fi

          # 提交信息从仓库里读（git log），**不要**用 github.event.head_commit.message 之类的
          # 表达式插值：提交信息是不可信输入，GitHub 会把表达式插值到脚本正文里
          # （连注释行也照插），带换行的提交信息足以注入命令。
          COMMIT="$(git log -1 --format='%h %s' 2>/dev/null || echo '未知（检出可能未完成）')"
          COMMIT="$(printf '%s' "$COMMIT" | sed 's/|/\\|/g')"   # 竖线会破坏下面的 Markdown 表格
          NOW="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          if [ -f deploy-failure.log ]; then
            ERRORS="$(cat deploy-failure.log)"
          else
            ERRORS="（没有捕获到部署日志：失败发生在部署步骤之前，或检出未完成）"
          fi

          BODY_FILE="deploy-failure-issue.md"
          {
            echo "## ⚠️ 部署失败"
            echo
            echo "| 项目 | 内容 |"
            echo "|---|---|"
            echo "| 提交 | \`${COMMIT}\` |"
            echo "| 失败步骤 | ${FAILED_STEP} |"
            echo "| 运行 | ${RUN_URL} |"
            echo "| 触发 | ${EVENT_NAME} / ${REF_NAME} |"
            echo "| 时间 | ${NOW} |"
            echo
            echo "### 从日志里提取的关键错误行"
            echo
            echo '```'
            echo "$ERRORS"
            echo '```'
            echo
            echo "---"
            echo "_本 Issue 由 \`.github/workflows/cloudflare-pages.yml\` 在运行时失败后自动创建；标题固定便于识别。查重只匹配「未关闭」的同名 Issue：还在处理中的会被追加评论，已关闭的视为已处理、下次失败会新建一条。_"
          } > "$BODY_FILE"
          echo "----- 将要写入 Issue 的正文 -----"
          cat "$BODY_FILE"

          # 只在「未关闭」的同名 Issue 里查重：命中就追加评论（重复失败不刷屏）；
          # 已关闭的不会命中 —— 关闭=已处理，再次失败应当新建一条（见上面步骤注释）。
          EXISTING="$(gh issue list --repo "$REPO" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "已有同类 Issue #${EXISTING}，追加评论"
            gh issue comment "$EXISTING" --repo "$REPO" --body-file "$BODY_FILE"
          else
            echo "没有同类 Issue，新建一条"
            gh issue create --repo "$REPO" --title "$TITLE" --body-file "$BODY_FILE"
          fi
